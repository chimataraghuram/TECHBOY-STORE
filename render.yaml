databases:
  - name: techboy-db
    databaseName: techboy
    user: techboy_user
    plan: free

services:
  - type: web
    name: techboy-backend
    env: python
    buildCommand: "./backend/build.sh" # You may need a build script to install pip requirements and migrate
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techboy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      # Add your email configuration here as well via the Render Dashboard
      # - key: EMAIL_HOST
      # - key: EMAIL_PORT
      # - key: EMAIL_USE_TLS
      # - key: EMAIL_HOST_USER
      # - key: EMAIL_HOST_PASSWORD

  - type: worker
    name: techboy-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python manage.py qcluster"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techboy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: techboy-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_NVIDIA_API_KEY
        value: "" # Provide NVIDIA NIM API Key in Render Dashboard
