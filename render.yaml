databases:
  - name: techboy-db
    databaseName: techboy
    user: techboy_user
    plan: free

services:
  - type: web
    name: techboy-backend
    env: python
    buildCommand: "cd backend && chmod +x build.sh && ./build.sh" # You may need a build script to install pip requirements and migrate
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techboy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      # Add your email configuration here as well via the Render Dashboard
      # - key: EMAIL_HOST
      # - key: EMAIL_PORT
      # - key: EMAIL_USE_TLS
      # - key: EMAIL_HOST_USER
      # - key: EMAIL_HOST_PASSWORD

  - type: worker
    name: techboy-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python manage.py qcluster"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techboy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: techboy-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_BACKEND_URL
        value: "https://techboy-backend.onrender.com/api"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_NVIDIA_API_KEY
        sync: false
